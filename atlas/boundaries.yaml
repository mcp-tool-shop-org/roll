summary: ""
boundaries:
  - name: .github
    globs:
      - .github/**
    role: config
  - name: fixtures
    globs:
      - fixtures/**
    role: data
  - name: roll-cli
    globs:
      - crates/roll-cli/**
    role: code
  - name: roll-core
    globs:
      - crates/roll-core/**
    role: code
  - name: root
    globs:
      - "*"
    role: config
  - name: site
    globs:
      - site/**
    role: site
  - name: src
    globs:
      - src/**
    role: code
  - name: tests
    globs:
      - tests/**
    role: test
