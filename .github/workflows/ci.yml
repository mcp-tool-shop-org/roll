name: CI

on:
  push:
    paths:
      - 'package.json'
      - 'tsconfig.json'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'package.json'
      - 'tsconfig.json'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 23]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Dependency vulnerability scan (gate D). The shipped package has zero
      # runtime deps; this guards the dev-tooling tree. Fails CI on a high/
      # critical advisory so it surfaces in PR rather than at publish time.
      - run: npm audit --audit-level=high
      - run: npm run verify
      # Smoke-test that the built binary actually resolves and runs (catches a
      # broken shebang / bad entry path that the test suite, which imports
      # modules directly, would miss). `verify` builds dist first.
      - run: node dist/bin.js --version

  publish:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
